<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./style.css" />
  <title>Question Queue</title>
</head>
<body>
  <section class="queue-shell">
    <header>
      <div>
        <p class="eyebrow">widget</p>
        <h1 id="queue-heading" tabindex="-1">Question Queue</h1>
      </div>
      <strong id="badge">0 pending</strong>
    </header>
    <p id="queue-status" class="sr-only" role="status" aria-live="polite"></p>
    <p id="empty" class="empty">No pending questions.</p>
    <div id="questions" class="questions"></div>
  </section>
  <script type="module" src="./queue.js"></script>
</body>
</html>
